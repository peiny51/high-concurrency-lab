spring.application.name=high-concurrency-lab

# Server
server.port=8080

# MySQL driver; connection details come from the active environment.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Actuator
management.endpoints.web.exposure.include=health,info

# Per-instance limits for the avalanche case, not a database-wide quota.
lab.cache-avalanche.max-concurrent-rebuilds=2
lab.cache-avalanche.max-wait-millis=100

# Shared quota for /api/rate-limit/product; example values, not a measured production capacity.
lab.rate-limit.max-requests=5
lab.rate-limit.window-seconds=10

# Purchase-intent producer: broker acknowledgement is not business completion.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.example.high_concurrency_lab.messaging.PurchaseMessageSerializer
spring.kafka.producer.acks=all
# Producer retry deduplication does not deduplicate separate submissions with the same requestId.
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=2000
spring.kafka.producer.properties[request.timeout.ms]=2000
spring.kafka.producer.properties[delivery.timeout.ms]=4000

# Purchase consumer: commit progress after business completion or confirmed failure-topic recovery.
spring.kafka.consumer.group-id=lab.purchase-processing.v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=com.example.high_concurrency_lab.messaging.PurchaseRequestDeserializer
spring.kafka.listener.ack-mode=record
# Keep historical development messages untouched; enable only after reviewing backlog and storage settings.
spring.kafka.listener.auto-startup=false

# Additional consumer attempts after the first failure; not producer send retries.
lab.purchase-consumer.retry-interval-millis=1000
lab.purchase-consumer.max-retries=2

# JSON purchase quantities and IDs must not silently truncate decimal numbers into integers.
spring.jackson.deserialization.accept-float-as-int=false
